name: Dependabot Safe Auto Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
  check_suite:
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read
  security-events: read

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_CHECK_SUITE_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
    steps:
      - name: Enable safe Dependabot auto-merge
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            pr_number="$EVENT_PULL_REQUEST_NUMBER"
          else
            if [[ -z "$EVENT_CHECK_SUITE_HEAD_SHA" ]]; then
              exit 0
            fi

            pr_number="$(
              gh api \
                --method GET \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${EVENT_CHECK_SUITE_HEAD_SHA}/pulls" |
                jq -r \
                  --arg head_sha "$EVENT_CHECK_SUITE_HEAD_SHA" \
                  '[.[] | select(.state == "open" and .head.sha == $head_sha)] | if length == 1 then .[0].number else empty end'
            )"
          fi

          if [[ ! "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            exit 0
          fi

          pr_json="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}"
          )"
          pr_state="$(jq -r '.state // empty' <<<"$pr_json")"
          author="$(jq -r '.user.login // empty' <<<"$pr_json")"
          is_draft="$(jq -r 'if .draft == false then false else true end' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref // empty' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          pr_body="$(jq -r '.body // empty' <<<"$pr_json")"

          if [[ "$pr_state" != "open" ]]; then
            exit 0
          fi

          if [[ "$author" != "app/dependabot" ]]; then
            if [[ "$author" != "dependabot[bot]" ]]; then
              exit 0
            fi
          fi

          if [[ "$is_draft" != "false" ]]; then
            exit 0
          fi

          if [[ -z "$head_sha" ]]; then
            exit 0
          fi

          default_branch="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}" \
              --jq '.default_branch'
          )"

          if [[ "$base_ref" != "$default_branch" ]]; then
            exit 0
          fi

          bump_pattern='Bumps[[:space:]]+\[([^]]+)\]'
          if [[ "$pr_body" =~ $bump_pattern ]]; then
            package_name="${BASH_REMATCH[1]}"
          else
            exit 0
          fi

          ghsa_pattern='GHSA-[[:alnum:]]{4}-[[:alnum:]]{4}-[[:alnum:]]{4}'
          if [[ ! "$pr_body" =~ $ghsa_pattern ]]; then
            exit 0
          fi

          files_json="$(mktemp)"
          alerts_json="$(mktemp)"
          checks_json="$(mktemp)"
          trap 'rm -f "$files_json" "$alerts_json" "$checks_json"' EXIT

          gh api \
            --paginate \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" > "$files_json"

          files_are_lockfiles="$(
            jq --slurp '
              [
                "package-lock.json",
                "npm-shrinkwrap.json",
                "yarn.lock",
                "pnpm-lock.yaml",
                "bun.lock",
                "bun.lockb",
                "Cargo.lock",
                "composer.lock",
                "Gemfile.lock",
                "Pipfile.lock",
                "poetry.lock",
                "uv.lock",
                "go.sum",
                "mix.lock",
                "Podfile.lock",
                "Package.resolved",
                "gradle.lockfile",
                "pubspec.lock",
                "deno.lock",
                "flake.lock"
              ] as $lockfiles
              | [.[] | .[]? | .filename] as $files
              | ($files | length > 0)
                and all(
                  $files[];
                  . as $path
                  | ($path | split("/") | last) as $filename
                  | ($lockfiles | index($filename)) != null
                )
            ' "$files_json"
          )"

          if [[ "$files_are_lockfiles" != "true" ]]; then
            exit 0
          fi

          gh api \
            --paginate \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -f state=open \
            -f "package=${package_name}" \
            -f scope=development \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/dependabot/alerts" > "$alerts_json"

          matching_alert_exists="$(
            jq --slurp \
              --arg package "$package_name" \
              --arg body "$pr_body" '
                [
                  .[] | .[]?
                  | select(
                      (.security_advisory.ghsa_id? // "") as $ghsa
                      | .state == "open"
                        and .dependency.package.name == $package
                        and .dependency.relationship == "transitive"
                        and .dependency.scope == "development"
                        and ($ghsa != "")
                        and ($body | contains($ghsa))
                    )
                ]
                | length > 0
              ' "$alerts_json"
          )"

          if [[ "$matching_alert_exists" != "true" ]]; then
            exit 0
          fi

          gh api \
            --paginate \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs" > "$checks_json"

          checks_are_complete_and_safe="$(
            jq --slurp '
              [.[] | .check_runs[]?] as $checks
              | ($checks | length > 0)
                and all(
                  $checks[];
                  .status == "completed"
                    and (
                      .conclusion == "success"
                      or .conclusion == "neutral"
                      or .conclusion == "skipped"
                    )
                )
            ' "$checks_json"
          )"

          if [[ "$checks_are_complete_and_safe" != "true" ]]; then
            exit 0
          fi

          latest_pr_json="$(
            gh api \
              --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}"
          )"
          initial_pr_conditions="$(jq -c '[.state, .draft, .base.ref, .head.sha, .body]' <<<"$pr_json")"
          latest_pr_conditions="$(jq -c '[.state, .draft, .base.ref, .head.sha, .body]' <<<"$latest_pr_json")"

          if [[ "$latest_pr_conditions" != "$initial_pr_conditions" ]]; then
            exit 0
          fi

          merge_state="$(
            gh pr view \
              "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus \
              --jq '.mergeStateStatus'
          )"

          if [[ "$merge_state" != "CLEAN" ]]; then
            exit 0
          fi

          gh pr merge \
            "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"
